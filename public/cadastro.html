<title>Loop()Social | Cadastro</title>

<script src="./js/sessao.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/main.css">
<link rel="stylesheet" href="./css/header.css">
<link rel="stylesheet" href="./css/text.css">
<link rel="stylesheet" href="./css/cadastro.css">
<link rel="icon" href="./assets/icon/favicon2.ico" />
</head>

<body>
  <header class="header">
    <ul class="header_navbar">
      <li class="header_navbar_list menu-text">
        <a class="menu-text" href="./index.html">Home</a>
      </li>
      <li class="header_navbar_list menu-text">
        <a class="menu-text" href="./login.html">Login</a>
      </li>
      <li class="header_navbar_list menu-text">
        <a class="menu-text" href="./cadastro.html">Cadastro</a>
      </li>
    </ul>
  </header>

  <div class="alerta_erro">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>
  <section class="cadastro">
    <div class="cadastro-div cadastro-text">
      <div class="cadastro-content cadastro-img">
        <h1>Cadastro</h1>
        <img src="./assets/imgs/pc.png">
        <button onclick="cadastrar()">Cadastrar</button>
        <p>
          <a style="text-decoration: underline;
                    font-weight: 700;" href="./login.html">
            Já tenho conta</a>
        </p>
      </div>
      <div class="cadastro-content">
        <form class="cadastro-form">
          <div class="dupla">
            <div class="cadastro-form-campos">
              <p>Nome completo</p>
              <input type="text" id="nome_input" />
            </div>
            <div class="cadastro-form-campos">
              <p>Usuário</p>
              <input type="text" id="user_input" />
            </div>
          </div>
          <div class="cadastro-form-campos">
            <p>E-mail</p>
            <input type="text" id="email_input" />
          </div>
          <div class="dupla">
            <div class="cadastro-form-campos">
              <p>Gênero</p>
              <select class="cadastro-form-campos" id="genero_input">
                <option value="0">Selecione...</option>
                <option value="F">Feminino</option>
                <option value="M">Masculino</option>
                <option value="O">Outro</option>
              </select>
            </div>
            <div class="cadastro-form-campos">
              <p>Idade</p>
              <input type="number" id="idade_input" />
            </div>
          </div>
          <div class="dupla">
            <div class="cadastro-form-campos">
              <p>Senha</p>
              <input type="password" id="senha_input" />
            </div>
            <div class="cadastro-form-campos">
              <p>Confirmar senha</p>
              <input type="password" id="confirmacao_senha_input" />
            </div>
          </div>
        </form>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
        <div id="div_erros_login"></div>
      </div>
    </div>
  </section>
</body>

</html>

<script>
  function cadastrar() {
    var nomeVar = nome_input.value;
    var userVar = user_input.value;
    var emailVar = email_input.value;
    var generoVar = genero_input.value;
    var idadeVar = idade_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (
      nomeVar == "" || userVar == "" ||
      emailVar == "" || generoVar == "" ||
      idadeVar == "" || senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    console.log("caminho0")
    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        userServer: userVar,
        emailServer: emailVar,
        generoServer: generoVar,
        idadeServer: idadeVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
