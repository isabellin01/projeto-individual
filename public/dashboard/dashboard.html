<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body onload="obterDados()">
    <header class="slide">

        <ul class="slide-header">
            <li class="slide-header-item">

            </li>
            <li class="slide-header-item">

            <li class="slide-header-item">

    </header>

    <section class="dash dash-text">
        <div class="dash-divs">
            <div class="dash-capa-content">
                <h1>Bem-vindo à dashboard</h1>
                <span>Verifique informações sobre a Loop()Social</p>
            </div>

                <img src="../assets/img/pc.png">

        <div class="dash-divs">
            <p class="dash-titles">Últimas 24 horas - engajamento</p>
            <ul class="dash-kpis">
                <li class="dash-kpis-item">

                    <span class="dash-kpi-title">Total respostas</span>

                </li>
                <li class="dash-kpis-item">
                    <span class="dash-kpi-title">Total curtidas</span>
                    <span class="dash-kpi-number">7</span>
                </li>
                <li class="dash-kpis-item">
                    <span class="dash-kpi-title">Novos usuários</span>
                    <span class="dash-kpi-number">7</span>
                </li>
            </ul>
        </div>
        <div class="dash-divs">
            <p class="dash-titles">Todos os tempos</p>
            <ul class="dash-kpis">
                <li class="dash-kpis-item">
                    <canvas id="barra-vertical"></canvas>
                </li>
                <li class="dash-kpis-item">
                    <canvas id="pizza"></canvas>
                </li>
                <li class="dash-kpis-item">
                    <canvas id="barra-horizontal"></canvas>
                </li>
            </ul>
        </div>
        <div class="dash-divs">
            <p class="dash-titles">Todos os tempos</p>
            <ul class="dash-kpis">
                <li class="dash-kpis-item">
                    <canvas id="barra-vertical"></canvas>
                </li>
                <li class="dash-kpis-item">
                    <canvas id="pizza"></canvas>
                </li>
            </ul>
        </div>

    </section>
</body>
<script>
    function obterDados() {
        // Aqui seria a função que obteria os dados do banco de dados
        // No caso, aqui você colocaria o fetch que teria o endereço da sua rota que você criou na pasta /routes e chamaria a função plotarGraficoLinha nessa função. Exemplo:

        // fetch('/obterDados')
        // .then(function(response){
        //   return response.json();
        // })
        // .then(function(data){
        //   plotarGraficoLinha(data);
        //   plotarGraficoBarraHor(data);
        // })
        // .catch(function(err){
        //   console.log(err);
        // })

        // Como eu não configurei as rotas, eu criei um array com os dados para simular a obtenção dos dados
        var dados = [{
            jogador: 'Endrick',
            votos: 10
        },
        {
            jogador: 'João',
            votos: 5
        },
        {
            jogador: 'Maria',
            votos: 15
        },
        {
            jogador: 'José',
            votos: 20
        },
        {
            jogador: 'Pedro',
            votos: 25
        },
        {
            jogador: 'Ana',
            votos: 30
        }]

        // Chamando a função para plotar o gráfico de linha com os dados
        plotarGraficoBarraVer(dados);
        // Chamando a função para plotar o gráfico de barra com os dados
        plotarGraficoPizza(dados)
        plotarGraficoBarraHor(dados)
    }

    // Função para plotar o gráfico de linha
    function plotarGraficoBarraVer(dados) {
    const ctx = document.getElementById('barra-vertical').getContext('2d');
    const jogadores = dados.map(d => d.jogador);
    const votos = dados.map(d => d.votos);

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: jogadores,
            datasets: [{
                label: 'Votos',
                data: votos,
                backgroundColor: '#650E82'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Votos por jogador (Barras Verticais)'
                }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
}
    function plotarGraficoPizza(dados) {
    const ctx = document.getElementById('pizza').getContext('2d');
    const jogadores = dados.map(d => d.jogador);
    const votos = dados.map(d => d.votos);

    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: jogadores,
            datasets: [{
                label: 'Votos',
                data: votos,
                backgroundColor: [
                    '#650E82', '#8B3FB8', '#A86ED2', '#C59BEB', '#E1C7F5', '#F2E1F8'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Distribuição de Votos (Pizza)'
                }
            }
        }
    });
}

    // Função para plotar o gráfico de barra
    function plotarGraficoBarraHor(dados) {
    const ctx = document.getElementById('barra-horizontal').getContext('2d');
    const jogadores = dados.map(d => d.jogador);
    const votos = dados.map(d => d.votos);

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: jogadores,
            datasets: [{
                label: 'Votos',
                data: votos,
                backgroundColor: '#650E82'
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Votos por jogador (Barras Horizontais)'
                }
            },
            scales: {
                x: { beginAtZero: true }
            }
        }
    });
}
</script>

</html>
