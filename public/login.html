<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/text.css">
    <link rel="stylesheet" href="./css/login.css">
    <title>Login</title>
</head>

<body>
    <header class="header">
        <ul class="header_navbar">
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./index.html">Home</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./login.html">Login</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./cadastro.html">Cadastro</a>
            </li>
        </ul>
    </header>
    <section class="login">
        <div class="login-div">
            <div class="login-content login-text">
                <h1>Login</h1>
                <p>Não tem conta?
                    <a style="text-decoration: underline;
                    font-weight: 700;"
                    href="./cadastro.html">
                    Cadastre uma conta nova</a>
                </p>
                <form class="login-form">
                    <div class="login-form-campos">
                        <p class="login-form-campos-user">Usuário</p>
                        <input type="text" />
                    </div>
                    <div class="login-form-campos">
                        <p>Senha</p>
                        <input type="password" />
                    </div>
                    <div>
                        <button>Entrar</button>
                    </div>
                </form>
            </div>
            <div class="login-img">
                <img src="./assets/img/pc.png">
            </div>
        </div>
    </section>
</body>

</html>
