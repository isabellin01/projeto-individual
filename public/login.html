<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gameloop | Login</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/text.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/icon/gameloop.png">
</head>

<body>

    <!--Header-->

    <header class="header">
        <ul class="header_navbar">
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./index.html">Home</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./login.html">Login</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./cadastro.html">Cadastro</a>
            </li>
        </ul>
    </header>


    <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>
    </div>
    <section class="login">
        <div class="login-div">
            <div class="login-content login-text">
                <h1>Login</h1>
                <p>Não tem conta?
                    <a style="text-decoration: underline;
                    font-weight: 700;" href="./cadastro.html">
                        Cadastre uma conta nova</a>
                </p>

                <div class="login-form">
                    <div class="login-form-campos">
                        <p class="login-form-campos-user">E-mail</p>
                        <input type="text" id="email_input" placeholder="email@email.com" />
                    </div>
                    <div class="login-form-campos">
                        <p>Senha</p>
                        <input type="password" id="senha_input" class="login-form-campos-psswd"
                            placeholder="**********" />
                    </div>
                    <button class="button" onclick="entrar()">Entrar</button>
                    <div id="div_aguardar" class="loading-div">
                        <img src="./assets/circle-loading.gif" id="loading-gif" style="margin-top: 15px;">
                    </div>
                </div>


                <div id="div_erros_login" style="display: flex; justify-content: center; margin-top: 15px;"></div>
            </div>
            <div class="login-img">
                <img src="./assets/imgs/pc.png">
            </div>
        </div>
    </section>
    <footer class="footer">
        <h3>Isabel Lin - SPTech &copy; 2025</h3>
    </footer>
</body>

</html>

<script>
    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Insira todos os campos corretamente";
            setInterval(sumirMensagem, 4000);
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/forum.html";
                    }, 1000);

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
