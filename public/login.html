<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loop()Social | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/text.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <!--Header-->

    <header class="header">
        <ul class="header_navbar">
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./index.html">Home</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./login.html">Login</a>
            </li>
            <li class="header_navbar_list menu-text">
                <a class="menu-text" href="./cadastro.html">Cadastro</a>
            </li>
        </ul>
    </header>

    <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>
    </div>

    <section class="login">
        <div class="login-div">
            <div class="login-content login-text">
                <h1>Login</h1>
                <p>Não tem conta?
                    <a style="text-decoration: underline;
                    font-weight: 700;" href="./cadastro.html">
                        Cadastre uma conta nova</a>
                </p>
                <form class="login-form">
                    <div class="login-form-campos">
                        <p class="login-form-campos-user">Usuário</p>
                        <input type="text" id="user_input" />
                    </div>
                    <div class="login-form-campos">
                        <p>Senha</p>
                        <input type="password" id="senha_input" class="login-form-campos-psswd" />
                    </div>
                    <button class="button" onclick="entrar()">Login</button>
                </form>
            </div>
            <div class="login-img">
                <img src="./assets/imgs/pc.png">
            </div>
            <div id="div_aguardar" class="loading-div">
                <img src="./assets/circle-loading.gif" id="loading-gif">
            </div>
            <div id="div_erros_login"></div>
        </div>
    </section>
</body>

</html>

<script>


    function entrar() {
        aguardar();
        var userVar = user_input.value;
        var senhaVar = senha_input.value;

        if (userVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", userVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                userServer: userVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.USER_USUARIO = json.user;
                    sessionStorage.EMAIL_USUARIO = json.email;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
